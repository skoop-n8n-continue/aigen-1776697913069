<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Skoop Calculator</title>
    <link rel="stylesheet" href="styles.css?v=y3l1o9">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <div class="prev-display" id="prev-display"></div>
                <div class="curr-display" id="curr-display">0</div>
            </div>
            <div class="grid">
                <button class="btn col-2" data-key="AC">AC</button>
                <button class="btn" data-key="DEL">DEL</button>
                <button class="btn op" data-key="/">÷</button>

                <button class="btn" data-key="7">7</button>
                <button class="btn" data-key="8">8</button>
                <button class="btn" data-key="9">9</button>
                <button class="btn op" data-key="*">×</button>

                <button class="btn" data-key="4">4</button>
                <button class="btn" data-key="5">5</button>
                <button class="btn" data-key="6">6</button>
                <button class="btn op" data-key="+">+</button>

                <button class="btn" data-key="1">1</button>
                <button class="btn" data-key="2">2</button>
                <button class="btn" data-key="3">3</button>
                <button class="btn op" data-key="-">-</button>

                <button class="btn" data-key=".">.</button>
                <button class="btn" data-key="0">0</button>
                <button class="btn col-2 equal" data-key="=">=</button>
            </div>
        </div>
    </div>
    <script src="script.js?v=y3l1o9"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
